# docker-compose.yml — THE submission gate (v3.docx §7).
# `docker compose up` from repo root must build and run the full system.
#
# Services:
#   postgres — chat persistence
#   redis    — Socket.IO adapter + rate-limit counters
#   migrate  — one-shot drizzle-kit migrate; seed waits for it to exit 0
#   seed     — one-shot REQ-049 demo fixture (alice/bob/carol + 'general');
#              backend waits for it to exit 0 so fresh bring-ups always have
#              the 'general' room that auth.ts's auto-enroll hook expects
#   backend  — Fastify (:4000): auth, mutations, Socket.IO, file upload/download
#   app      — Next.js (:3000): UI
#
# First run:
#   docker compose up --build
# Open http://localhost:3000
#
# See docs/SMOKE.md for the full copy-paste verification sequence.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  # Runs drizzle-kit migrate once, then exits. Backend gates on
  # service_completed_successfully so the app never serves traffic against
  # an empty schema on a fresh `docker compose up`. REDIS_URL is set because
  # env.ts zod-validates it at module import; drizzle-kit itself only uses
  # DATABASE_URL. SESSION_SECRET is unused here but required by the same env
  # schema, so we pass the compose default to avoid a startup crash.
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-prod-32-char-min-xxxxxx}
      WEB_ORIGIN: http://localhost:3000
    command: ["pnpm", "db:migrate"]
    restart: "no"

  # One-shot demo fixture (REQ-049): alice/bob/carol + 'general' room + seed
  # messages + memberships. Makes `docker compose up` the real submission
  # gate — prior to this, judges had to run `docker compose exec backend
  # pnpm db:seed` manually, and a fresh signup landing on /rooms/general
  # would 403 because the room didn't exist. Idempotent: seed.ts uses
  # `onConflictDoNothing` everywhere, so re-runs on an already-seeded DB
  # are no-ops. Needs Redis because better-auth's rate limiter (and thus
  # `auth.api.signUpEmail`) initialises against secondaryStorage on import.
  seed:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-prod-32-char-min-xxxxxx}
      WEB_ORIGIN: http://localhost:3000
    command: ["pnpm", "db:seed"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-prod-32-char-min-xxxxxx}
      WEB_ORIGIN: http://localhost:3000
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: info
    volumes:
      - uploads:/data/uploads
    ports:
      - "4000:4000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
      NEXT_PUBLIC_APP_NAME: "AI Herders Jam"
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  uploads:
