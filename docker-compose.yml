# docker-compose.yml — THE submission gate (v3.docx §7).
# `docker compose up` from repo root must build and run the full system.
#
# Services:
#   postgres — chat persistence
#   redis    — Socket.IO adapter + rate-limit counters
#   backend  — Fastify (:4000): auth, mutations, Socket.IO, file upload/download
#   app      — Next.js (:3000): UI
#
# First run:
#   docker compose up --build
# Open http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-prod-32-char-min-xxxxxx}
      WEB_ORIGIN: http://localhost:3000
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: info
    volumes:
      - uploads:/data/uploads
    ports:
      - "4000:4000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
      NEXT_PUBLIC_APP_NAME: "AI Herders Jam"
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  uploads:
